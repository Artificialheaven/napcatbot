<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话展示</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status-bar {
            background: #f0f0f0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .controls select, .controls button {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .controls button.active {
            background: #4CAF50;
        }

        .chat-container {
            height: 600px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-assistant {
            display: flex;
            justify-content: flex-start;
        }

        .message-thinking {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-thinking .thinking-bubble {
            background: #fff9e6;
            color: #666;
            border: 1px dashed #ffd700;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-style: italic;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .message-user .message-label {
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            border-bottom-left-radius: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .streaming-text {
            border-right: 2px solid #667eea;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        .thinking-icon {
            display: inline-block;
            animation: rotate 2s linear infinite;
            margin-right: 5px;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .toggle-thinking {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 8px;
            margin-left: 10px;
            border-radius: 3px;
        }

        .toggle-thinking:hover {
            background: #f0f0f0;
            color: #666;
        }

        .thinking-content {
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .debug-log {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI对话展示</h1>
            <p>实时查看AI与用户的对话记录（含思考过程）</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>
            <div>
                <span id="messageCount">消息数: 0</span>
            </div>
        </div>

        <div class="controls">
            <label for="userSelect">选择用户：</label>
            <select id="userSelect">
                <option value="">请选择用户ID</option>
            </select>
            <button onclick="loadConversation()">加载对话</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <p>请选择一个用户ID来查看对话记录</p>
            </div>
        </div>
    </div>

    <div class="debug-log" id="debugLog" style="display: none;">
        <div>调试日志:</div>
    </div>

    <script>
        let socket = null;
        let currentUser = null;
        let currentMessageBubble = null;
        let currentThinkingBubble = null;
        let isStreaming = false;
        let isThinking = false;
        let showThinking = true;

        // 调试日志函数
        function debugLog(message) {
            const log = document.getElementById('debugLog');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(message);
        }

        // 页面加载时初始化
        window.onload = function() {
            debugLog('页面加载完成');
            initWebSocket();
            loadUserList();
        };

        // 初始化WebSocket连接
        function initWebSocket() {
            debugLog('正在连接WebSocket...');
            socket = io();

            socket.on('connect', function() {
                debugLog('✓ WebSocket已连接');
                updateStatus(true);

                // 如果已选择用户，重新订阅
                if (currentUser) {
                    subscribeToUser(currentUser);
                }
            });

            socket.on('disconnect', function() {
                debugLog('✗ WebSocket断开连接');
                updateStatus(false);
            });

            socket.on('status', function(data) {
                debugLog('状态: ' + data.msg);
            });

            socket.on('subscribed', function(data) {
                debugLog('✓ 已订阅用户: ' + data.user_id);
            });

            socket.on('conversation_history', function(data) {
                debugLog('收到历史对话: ' + data.messages.length + ' 条消息');
                displayMessages(data.messages);
            });

            socket.on('conversation_loaded', function(data) {
                debugLog('对话已加载: ' + data.messages.length + ' 条消息');
                displayMessages(data.messages);
            });

            socket.on('new_message', function(data) {
                debugLog('收到新消息: source=' + data.source + ', user_id=' + data.user_id);

                // 如果是当前订阅的用户，显示消息
                if (!currentUser || data.user_id === currentUser) {
                    appendMessage(data.source, data.content);
                } else {
                    debugLog('消息不属于当前用户，忽略');
                }
            });

            socket.on('thinking_start', function(data) {
                debugLog('AI开始思考: user_id=' + data.user_id);
                if (!currentUser || data.user_id === currentUser) {
                    startThinking();
                }
            });

            socket.on('thinking_end', function(data) {
                debugLog('AI思考完成: user_id=' + data.user_id);
                if (!currentUser || data.user_id === currentUser) {
                    endThinking();
                }
            });

            socket.on('streaming_chunk', function(data) {
                debugLog('收到流式片段: type=' + data.type + ', length=' + data.chunk.length);

                // 如果是当前订阅的用户，流式显示
                if (!currentUser || data.user_id === currentUser) {
                    if (data.type === 'thinking') {
                        appendThinkingChunk(data.chunk, data.is_complete);
                    } else {
                        appendContentChunk(data.chunk, data.is_complete);
                    }
                }
            });
        }

        // 订阅用户
        function subscribeToUser(userId) {
            if (socket) {
                debugLog('订阅用户: ' + userId);
                socket.emit('subscribe_user', { user_id: userId });
            }
        }

        // 更新状态
        function updateStatus(isConnected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (isConnected) {
                statusDot.classList.add('active');
                statusText.textContent = '已连接 (WebSocket)';
            } else {
                statusDot.classList.remove('active');
                statusText.textContent = '未连接';
            }
        }

        // 加载用户列表
        async function loadUserList() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();

                const select = document.getElementById('userSelect');
                select.innerHTML = '<option value="">请选择用户ID</option>';

                data.users.forEach(userId => {
                    const option = document.createElement('option');
                    option.value = userId;
                    option.textContent = userId;
                    select.appendChild(option);
                });

                debugLog('加载了 ' + data.users.length + ' 个用户');
            } catch (error) {
                debugLog('加载用户列表失败: ' + error);
            }
        }

        // 加载对话记录
        function loadConversation() {
            const userId = document.getElementById('userSelect').value;

            if (!userId) {
                alert('请先选择一个用户ID');
                return;
            }

            currentUser = userId;
            debugLog('加载用户对话: ' + userId);

            // 通过WebSocket加载对话
            if (socket) {
                socket.emit('load_conversation', { user_id: userId });
                subscribeToUser(userId);
            }
        }

        // 显示消息
        function displayMessages(messages) {
            const chatContainer = document.getElementById('chatContainer');
            const messageCountEl = document.getElementById('messageCount');

            if (!messages || messages.length === 0) {
                chatContainer.innerHTML = '<div class="empty-state"><p>暂无对话记录</p></div>';
                messageCountEl.textContent = '消息数: 0';
                return;
            }

            let html = '';
            messages.forEach(msg => {
                if (msg.source === 'user') {
                    html += createUserMessage(msg.content);
                } else if (msg.source === 'thinking') {
                    html += createThinkingMessage(msg.content, true);
                } else {
                    html += createAssistantMessage(msg.content);
                }
            });

            chatContainer.innerHTML = html;
            messageCountEl.textContent = `消息数: ${messages.length}`;

            // 滚动到底部
            scrollToBottom();
            debugLog('显示了 ' + messages.length + ' 条消息');
        }

        // 创建用户消息HTML
        function createUserMessage(content) {
            return `
                <div class="message message-user">
                    <div>
                        <div class="message-label">👤 用户</div>
                        <div class="message-bubble">${escapeHtml(content)}</div>
                    </div>
                </div>
            `;
        }

        // 创建AI消息HTML
        function createAssistantMessage(content) {
            return `
                <div class="message message-assistant">
                    <div>
                        <div class="message-label">🤖 AI</div>
                        <div class="message-bubble">${escapeHtml(content)}</div>
                    </div>
                </div>
            `;
        }

        // 创建思考消息HTML
        function createThinkingMessage(content, collapsed = false) {
            const displayStyle = collapsed ? 'display: none;' : '';
            return `
                <div class="message message-thinking">
                    <div>
                        <div class="message-label">
                            💭 思考过程
                            <button class="toggle-thinking" onclick="toggleThinking(this)">
                                ${collapsed ? '展开' : '收起'}
                            </button>
                        </div>
                        <div class="thinking-bubble">
                            <div class="thinking-content" style="${displayStyle}">${escapeHtml(content)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 切换思考显示
        function toggleThinking(btn) {
            const thinkingContent = btn.parentElement.nextElementSibling.querySelector('.thinking-content');
            if (thinkingContent.style.display === 'none') {
                thinkingContent.style.display = 'block';
                btn.textContent = '收起';
            } else {
                thinkingContent.style.display = 'none';
                btn.textContent = '展开';
            }
        }

        // 追加单条消息
        function appendMessage(source, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageCountEl = document.getElementById('messageCount');

            // 移除空状态
            if (chatContainer.querySelector('.empty-state')) {
                chatContainer.innerHTML = '';
            }

            let messageHtml = '';
            if (source === 'user') {
                messageHtml = createUserMessage(content);
                debugLog('显示用户消息');
            } else if (source === 'thinking') {
                messageHtml = createThinkingMessage(content);
                debugLog('显示思考消息');
            } else {
                messageHtml = createAssistantMessage(content);
                debugLog('显示AI消息');
            }

            chatContainer.insertAdjacentHTML('beforeend', messageHtml);

            // 更新消息计数
            const currentCount = parseInt(messageCountEl.textContent.split(': ')[1]) || 0;
            messageCountEl.textContent = `消息数: ${currentCount + 1}`;

            scrollToBottom();
        }

        // 开始思考
        function startThinking() {
            isThinking = true;
            debugLog('开始显示思考过程');

            const chatContainer = document.getElementById('chatContainer');

            // 移除空状态
            if (chatContainer.querySelector('.empty-state')) {
                chatContainer.innerHTML = '';
            }

            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message message-thinking';
            thinkingDiv.id = 'current-thinking';
            thinkingDiv.innerHTML = `
                <div>
                    <div class="message-label">
                        <span class="thinking-icon">💭</span> AI思考中...
                    </div>
                    <div class="thinking-bubble streaming-text">
                        <div class="thinking-content"></div>
                    </div>
                </div>
            `;

            chatContainer.appendChild(thinkingDiv);
            currentThinkingBubble = thinkingDiv.querySelector('.thinking-content');

            scrollToBottom();
        }

        // 结束思考
        function endThinking() {
            isThinking = false;
            debugLog('思考过程结束');

            if (currentThinkingBubble) {
                const thinkingDiv = document.getElementById('current-thinking');
                if (thinkingDiv) {
                    thinkingDiv.removeAttribute('id');
                    thinkingDiv.querySelector('.message-label').innerHTML = `
                        💭 思考过程
                        <button class="toggle-thinking" onclick="toggleThinking(this)">收起</button>
                    `;
                    thinkingDiv.querySelector('.thinking-bubble').classList.remove('streaming-text');
                }
                currentThinkingBubble = null;
            }
        }

        // 追加思考片段
        function appendThinkingChunk(chunk, isComplete) {
            if (currentThinkingBubble) {
                currentThinkingBubble.textContent += chunk;
                scrollToBottom();
            }
        }

        // 追加回复片段
        function appendContentChunk(chunk, isComplete) {
            const chatContainer = document.getElementById('chatContainer');

            // 移除空状态
            if (chatContainer.querySelector('.empty-state')) {
                chatContainer.innerHTML = '';
            }

            // 如果不是流式状态，创建新的消息气泡
            if (!isStreaming) {
                isStreaming = true;
                debugLog('开始显示AI回复');

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message message-assistant';
                messageDiv.id = 'current-response';
                messageDiv.innerHTML = `
                    <div>
                        <div class="message-label">🤖 AI</div>
                        <div class="message-bubble streaming-text"></div>
                    </div>
                `;

                chatContainer.appendChild(messageDiv);
                currentMessageBubble = messageDiv.querySelector('.message-bubble');
            }

            // 追加文本片段
            if (currentMessageBubble) {
                currentMessageBubble.textContent += chunk;
                scrollToBottom();
            }

            // 如果完成，移除光标效果
            if (isComplete) {
                isStreaming = false;
                debugLog('AI回复完成');

                if (currentMessageBubble) {
                    const messageDiv = document.getElementById('current-response');
                    if (messageDiv) {
                        messageDiv.removeAttribute('id');
                    }
                    currentMessageBubble.classList.remove('streaming-text');
                    currentMessageBubble = null;
                }

                // 更新消息计数
                const messageCountEl = document.getElementById('messageCount');
                const currentCount = parseInt(messageCountEl.textContent.split(': ')[1]) || 0;
                messageCountEl.textContent = `消息数: ${currentCount + 1}`;
            }
        }

        // HTML转义（保留换行）
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 滚动到底部
        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
